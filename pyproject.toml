# Workspace root. It ships no code of its own; the distributions live in
# python/<name>. See CONTRIBUTING.md for the layout.

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
oneberth = { workspace = true }

[dependency-groups]
dev = [
    # The base install alone: the identity core is tested with no third-party
    # code. An adapter's extra joins this list in the step that builds it.
    "oneberth",
    "mypy>=2",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88
# The packages need 3.11; this root has no [project] for ruff to read it from.
target-version = "py311"
# Every package keeps its importable code in python/<name>/src, so isort can
# tell first-party imports from third-party ones.
src = ["python/*/src"]
# The specs' snippets are illustrations, and ts/ has its own tooling.
extend-exclude = ["docs", "ts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = [
    "conftest.py",
    "python/*/src",
    "python/*/tests",
]

[tool.pytest.ini_options]
testpaths = ["python/oneberth/tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
