# Workspace root. It ships no code of its own; the distributions live in
# python/<name>. See CONTRIBUTING.md for the layout.

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
oneberth = { workspace = true }

[dependency-groups]
dev = [
    # The adapters' extras, for their tests. The core's tests import none of it.
    "oneberth[postgres,providers,web]",
    "mypy>=2",
    # The browser journey. The browser itself is installed apart; without it,
    # that test skips.
    "playwright>=1.50",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    # The test oracle of oneberth's own QR encoder; never shipped.
    "qrcodegen>=1.8,<2",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88
# The packages need 3.11; this root has no [project] for ruff to read it from.
target-version = "py311"
# Every package keeps its importable code in python/<name>/src, so isort can
# tell first-party imports from third-party ones.
src = ["python/*/src"]
# The specs' snippets are illustrations, and ts/ has its own tooling.
extend-exclude = ["docs", "ts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = [
    "conftest.py",
    "python/*/src",
    "python/*/tests",
]

[tool.pytest.ini_options]
testpaths = ["python/oneberth/tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
markers = ["postgres: needs a PostgreSQL server; skipped unless ONEBERTH_TEST_DATABASE_URL is set"]
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
