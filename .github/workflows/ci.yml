name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job has a time limit, so that a hang fails the job instead of holding a
# runner for hours. A passing lint job took about 15 s, and a test job about a
# minute before the Docker tests came; those add under a minute.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Each distribution ships its own copy of the license files, so they must
      # stay identical to the ones at the root of the repository.
      - name: Check license files are in sync
        run: |
          for dir in python/*/; do
            for file in LICENSE NOTICE AUTHORS; do
              diff -q "$file" "$dir$file"
            done
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The browser journey needs the built page of the node package and
          # Chromium: once is enough.
          - python-version: "3.12"
            browser: true
    services:
      # The PostgreSQL store's tests run against this server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: oneberth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - if: matrix.browser
        uses: actions/setup-node@v7
        with:
          node-version-file: ts/oneberth-ui/.nvmrc
          cache: npm
          cache-dependency-path: ts/oneberth-ui/package-lock.json
      - if: matrix.browser
        name: Build the page of the node package and fetch a browser, for the browser journey
        run: |
          (cd ts/oneberth-ui && npm ci && npm run build:page)
          uv run playwright install --with-deps chromium
      # The launcher's Docker tests run on every Python: the runner has a
      # Docker daemon, and they build their image from python:3.12-slim.
      - run: uv run pytest
        env:
          ONEBERTH_TEST_DATABASE_URL: postgresql://postgres:secret@127.0.0.1:5432/oneberth_test

  # Every commit of the pull request is signed off (CONTRIBUTING.md). Only the
  # commits of the pull request, not the history of main: the first commits
  # predate the rule, and those cannot be rewritten.
  dco:
    name: sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE..$HEAD"
