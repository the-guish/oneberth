name: UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/oneberth-ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ts/oneberth-ui/.nvmrc
          cache: npm
          cache-dependency-path: ts/oneberth-ui/package-lock.json
      - run: npm ci
      # Advisories for everything installed; signatures and provenance for
      # what a host bundles. The registry does not serve attestations for
      # every dev-only package, and a 404 there is not a reason to fail.
      - name: Known advisories, and registry signatures and provenance
        run: |
          npm audit
          npm audit signatures --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The package's gate, over its peers, its files and its size budget
        run: npm run build
      - name: The bundled-package list is committed as the gate wrote it
        run: git diff --exit-code -- bundled-packages.txt
