#
# A dependency change is a pull request of its own (DEPENDENCIES.md), and the
# licence gates run on it like on any other. The cooldown keeps us off a
# release that is withdrawn or fixed in its first days -- a window in which
# compromised packages are usually caught. A Dependabot pull request carries
# no sign-off; a maintainer takes it over before it is merged
# (CONTRIBUTING.md).

version: 2
updates:
  # The Python workspace, one uv.lock at the root. "uv" is the ecosystem that
  # understands uv.lock; "pip" would read pyproject.toml alone and leave the
  # lock behind.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "python"

  # The npm package. Exact versions in package.json and a committed
  # package-lock.json, so an update is a diff somebody reads
  # (docs/contributing/js-dependencies.md).
  - package-ecosystem: "npm"
    directory: "/ts/oneberth-protocol"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ts"

  # The actions this repository's workflows run, pinned to commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
